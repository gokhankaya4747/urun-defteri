<title>Kuruyemiş Parti Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header (marka + firma seçici), içerik sütunu, telefonda alt sekme çubuğu; partiler masaüstünde aşama panosu */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#E4EAE6; --line:#CFD9D3; --fg:#16201A; --muted:#566660;
  --accent:#4A7426; --accent-ink:#FFFFFF; --accent-soft:#DEEACF;
  --firm-a:#4A7426; --firm-b:#2D62A0;
  --st-siparis:#5E6B74; --st-onodeme:#9A6A0B; --st-yuklendi:#2D62A0; --st-yolda:#127A80; --st-depoda:#4A7426; --st-kapandi:#8B918E;
  --good:#2C7A35; --warn:#A8530F; --bad:#B3261E; --warn-soft:#FBEBDD; --bad-soft:#FBE3E1;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201B; --surface-2:#1F2923; --line:#2E3A33; --fg:#E4EBE6; --muted:#97A69E;
  --accent:#9DC56C; --accent-ink:#10160C; --accent-soft:#25331B;
  --firm-a:#9DC56C; --firm-b:#7FB0EA;
  --st-siparis:#A3AFB7; --st-onodeme:#E2B04F; --st-yuklendi:#7FB0EA; --st-yolda:#5CC6CC; --st-depoda:#9DC56C; --st-kapandi:#7D8580;
  --good:#7CC985; --warn:#EBA163; --bad:#F2877F; --warn-soft:#3A2A1A; --bad-soft:#3D2120;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201B; --surface-2:#1F2923; --line:#2E3A33; --fg:#E4EBE6; --muted:#97A69E;
  --accent:#9DC56C; --accent-ink:#10160C; --accent-soft:#25331B;
  --firm-a:#9DC56C; --firm-b:#7FB0EA;
  --st-siparis:#A3AFB7; --st-onodeme:#E2B04F; --st-yuklendi:#7FB0EA; --st-yolda:#5CC6CC; --st-depoda:#9DC56C; --st-kapandi:#7D8580;
  --good:#7CC985; --warn:#EBA163; --bad:#F2877F; --warn-soft:#3A2A1A; --bad-soft:#3D2120;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em}
.muted{color:var(--muted)}
h1,h2,h3,h4{text-wrap:balance;margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font:700 21px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;display:block}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.tabs button:hover{color:var(--fg)}
.firmsel{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.firmsel button{border:0;background:none;padding:6px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.firmsel button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{max-width:1240px;margin:0 auto;padding-block:18px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
.bottom{display:none}
@media (max-width:520px){
  .brand small{display:none}
  #addbtn{padding:8px 11px}
}
@media (max-width:820px){
  .tabs{display:none}
  .top-in{gap:10px}
  .firmsel{order:3;width:100%}
  .firmsel button{flex:1;justify-content:center}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
  .bottom button svg{width:22px;height:22px}
  .bottom button[aria-current="page"]{color:var(--accent);font-weight:600}
}

.banner{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner b{color:var(--warn)}
.conn{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);font-size:14px}

.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h2{font:700 28px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;margin-right:auto}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h3{font:600 15px/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sec-h .r{margin-left:auto}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kpi .v{font:700 30px/1.1 var(--f-disp);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}
.kpi.warn .v{color:var(--warn)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:25px}}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;min-width:0}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;flex:none}
.row .end .a{font-weight:600;font-variant-numeric:tabular-nums}
.row .end .b{font-size:12px;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);font-size:14px;text-align:center}
.alert-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:14px;font-weight:700}
.alert-ic.w{background:var(--warn-soft);color:var(--warn)}
.alert-ic.b{background:var(--bad-soft);color:var(--bad)}
.alert-ic.i{background:var(--accent-soft);color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid currentColor;line-height:1.5}
.pill .dot{background:currentColor}
.firmtag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}

/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);white-space:nowrap}
tr:first-child td{border-top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--line)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.75}
.search{flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}

/* board */
.board{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,6),minmax(220px,1fr));overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;align-self:start}
.col-h{display:flex;align-items:center;gap:7px;font:700 15px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.06em;padding:4px 2px 2px}
.col-h .c{margin-left:auto;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.col .none{font-size:13px;color:var(--muted);padding:6px 2px 8px}
@media (max-width:820px){.board{display:flex;flex-direction:column}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:5px;width:100%;min-width:0}
.card:hover{border-color:var(--muted)}
.card .top1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .prod{font-weight:600;font-size:15px;line-height:1.25}
.card .meta{font-size:13px;color:var(--muted);line-height:1.35}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.card .barl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px)}
@media (max-width:620px){.sheet{top:auto;left:0;height:calc(100% - 28px - env(safe-area-inset-top,0px));border-radius:16px 16px 0 0;padding-top:0}}
.sh-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.sh-head h3{font:700 20px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.sh-body>*{flex-shrink:0}
.sh-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-foot .sp{flex:1}
.ferr{color:var(--bad);font-size:13px;width:100%}

.form{display:flex;flex-wrap:wrap;gap:12px}
.fsec{width:100%;font:600 14px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.fld{display:flex;flex-direction:column;gap:5px;width:100%;min-width:0}
.fld.half{width:calc(50% - 6px)}
.fld.third{width:calc(33.33% - 8px)}
@media (max-width:420px){.fld.third{width:calc(50% - 6px)}}
.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* detail */
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead .code{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dhead .ttl{font:700 26px/1.1 var(--f-disp);letter-spacing:.01em}
.stepper{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{flex:1;min-width:76px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.step i{height:6px;border-radius:3px;background:var(--surface-2);display:block}
.step span{font-size:11.5px;color:var(--muted);line-height:1.2}
.step small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.done i{background:var(--sc)}
.step.cur span{color:var(--fg);font-weight:600}
.step:hover i{outline:1px solid var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;font-size:14px}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:1px 0 0;font-weight:500;overflow-wrap:anywhere}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.money>div{background:var(--surface);padding:10px 12px;min-width:0}
.money .l{font-size:12px;color:var(--muted)}
.money .v{font:700 20px/1.2 var(--f-disp);font-variant-numeric:tabular-nums}
.money .v.bad{color:var(--bad)} .money .v.good{color:var(--good)} .money .v.warn{color:var(--warn)}
.dsec{display:flex;flex-direction:column;gap:8px}
.dsec .h{display:flex;align-items:center;gap:8px}
.dsec .h h4{font:600 14px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:auto}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.log div{display:flex;gap:10px}
.log time{flex:none;width:92px;font-variant-numeric:tabular-nums}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap}

.chooser{display:grid;gap:10px}
.chooser button{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px}
.chooser button:hover{border-color:var(--accent)}
.chooser b{display:block;font-size:16px}
.chooser span{font-size:13px;color:var(--muted)}
.chooser svg{flex:none;color:var(--accent)}

.month{font:700 16px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 2px 8px}
.typeic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;font:700 13px/1 var(--f-disp);letter-spacing:.04em}
.typeic.p{background:var(--accent-soft);color:var(--accent)}
.typeic.s{background:color-mix(in srgb,var(--firm-b) 16%,transparent);color:var(--firm-b)}
.typeic.o{background:var(--warn-soft);color:var(--warn)}
.typeic.t{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.typeic.m{background:var(--bad-soft);color:var(--bad)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (min-width:821px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="8" width="30" height="18" rx="2" fill="none" stroke="var(--accent)" stroke-width="2.2"/><path d="M8 11v12M13 11v12M18 11v12M23 11v12M28 11v12" stroke="var(--accent)" stroke-width="1.6"/></svg>
      <div><b>Parti Defteri</b><small>Kuruyemiş · Mersin Serbest Bölge</small></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Bölümler"></nav>
    <div class="firmsel" id="firmsel" aria-label="Firma"></div>
    <button class="btn pri" id="addbtn" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Ekle</button>
    <button class="iconbtn" id="setbtn" type="button" aria-label="Ayarlar"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<main id="main"></main>
<nav class="bottom" id="btabs" aria-label="Bölümler"></nav>
<div id="sheetroot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
document.documentElement.lang="tr";
/* ---------- sabitler ---------- */
const ST = [
  {k:"siparis", t:"Sipariş verildi", s:"Sipariş"},
  {k:"onodeme", t:"Ön ödeme yapıldı", s:"Ön ödeme"},
  {k:"yuklendi", t:"Yüklendi", s:"Yüklendi"},
  {k:"yolda", t:"Yolda", s:"Yolda"},
  {k:"depoda", t:"Mersin SB'de", s:"Mersin SB"},

const ORIGINS = ["İran","ABD","Afganistan","Hindistan","Vietnam","Şili","Arjantin","Brezilya","Çin","Özbekistan","Avustralya","Mısır","Fildişi Sahili"];

/* ---------- durum ---------- */
const S = {lots:[],sales:[],pays:[],exps:[],firms:{},ready:{},view:"ozet",firm:"all",stage:"all",market:"all",cari:"ted",q:"",pq:"",year:"all",atype:"all",stack:[],conn:""};
let db=null, user=null, dl=null, me=null, canWrite=true;

try{ const v=localStorage.getItem("pd.view"); if(VIEWS.some(x=>x.k===v)) S.view=v; const f=localStorage.getItem("pd.firm"); if(["all","a","b"].includes(f)) S.firm=f; }catch(e){}
const save = (k,v)=>{ try{localStorage.setItem(k,v)}catch(e){} };

/* ---------- yardımcılar ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0 = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2});
const nf4 = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:4});
const usdf = v => (v<0?"−":"")+"$"+nf0.format(Math.abs(Math.round(v)));
const moneyf = (v,c) => c==="TL" ? nf0.format(Math.round(v))+" ₺" : usdf(v);
const kgf = v => Math.abs(v)>=1000 ? nf2.format(v/1000)+" ton" : nf0.format(v)+" kg";
const MON = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const MONL = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const fd = d => { if(!d) return "—"; const [y,m,dd]=d.slice(0,10).split("-"); return `${+dd} ${MON[+m-1]} ${y}`; };
const fds = d => { if(!d) return "—"; const [,m,dd]=d.slice(0,10).split("-"); return `${+dd} ${MON[+m-1]}`; };
const today = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; };
const days = d => Math.round((new Date(d+"T12:00:00") - new Date(today()+"T12:00:00"))/864e5);
const usd = (a,c,k) => c==="TL" ? ((+k>0)? (+a||0)/(+k) : 0) : (+a||0);
const parseNum = s => {
  s = String(s??"").trim().replace(/\s|₺|\$/g,""); if(!s) return null;
  if(s.includes(",") && s.includes(".")) s = s.replace(/\./g,"").replace(",",".");
  else if(s.includes(",")) s = s.replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const n = Number(s); return Number.isFinite(n) ? n : NaN;
};
const firmName = id => S.firms[id]?.name || FIRM_DEF[id] || "—";
const firmColor = id => id==="b" ? "var(--firm-b)" : "var(--firm-a)";
const firmTag = id => `<span class="firmtag"><span class="dot" style="background:${firmColor(id)}"></span>${esc(firmName(id))}</span>`;
const stPill = k => { const s=ST[STI[k]]||ST[0]; return `<span class="pill" style="color:var(--st-${s.k})"><span class="dot"></span>${s.s}</span>`; };
const inFirm = x => S.firm==="all" || x.firmId===S.firm;
const lotById = id => S.lots.find(l=>l.id===id);
const saleById = id => S.sales.find(s=>s.id===id);
const key = s => String(s||"").trim().toLocaleLowerCase("tr");
const uniq = arr => [...new Set(arr.filter(Boolean).map(s=>String(s).trim()))].sort((a,b)=>a.localeCompare(b,"tr"));
const lotLabel = l => l ? `${l.code||"—"} · ${l.product||""}` : "—";
const toastEl = () => document.getElementById("toast");
let toastT; const toast = m => { const t=toastEl(); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2400); };
const svg = (p,s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

/* ---------- hesaplar ---------- */
function calcAll(){
  C.sale.clear(); C.lot.clear();
  for(const s of S.sales){
    const tot=(+s.kg||0)*(+s.ppk||0), totUSD=usd(tot,s.cur,s.kur);
    const pays=S.pays.filter(p=>p.dir==="in"&&p.saleId===s.id);
    const got=pays.reduce((a,p)=>a+usd(p.amount,p.cur,p.kur),0);
    const exps=S.exps.filter(x=>x.saleId===s.id);
    const exp=exps.reduce((a,x)=>a+usd(x.amount,x.cur,x.kur),0);
    C.sale.set(s.id,{tot,totUSD,got,due:totUSD-got,pays,exps,exp});
  }
  for(const l of S.lots){
    const kg=+l.kg||0, cost=kg*(+l.ppk||0), costUSD=usd(cost,l.cur,l.kur);
    const pays=S.pays.filter(p=>p.dir==="out"&&p.lotId===l.id);
    const paid=pays.reduce((a,p)=>a+usd(p.amount,p.cur,p.kur),0);
    const sales=S.sales.filter(s=>s.lotId===l.id);
    const soldKg=sales.reduce((a,s)=>a+(+s.kg||0),0);
    const rev=sales.reduce((a,s)=>a+(C.sale.get(s.id)?.totUSD||0),0);
    const unitUSD=kg?costUSD/kg:0;
    const exps=S.exps.filter(x=>x.lotId===l.id);
    const exp=exps.reduce((a,x)=>a+usd(x.amount,x.cur,x.kur),0)+sales.reduce((a,s)=>a+(C.sale.get(s.id)?.exp||0),0);
    C.lot.set(l.id,{kg,cost,costUSD,paid,due:costUSD-paid,pays,sales,soldKg,stock:kg-soldKg,rev,unitUSD,exps,exp,profit:rev-soldKg*unitUSD-exp,pct:costUSD?Math.max(0,Math.min(1,paid/costUSD)):0});
  }
}
const LC = l => C.lot.get(l.id) || {kg:0,cost:0,costUSD:0,paid:0,due:0,pays:[],sales:[],soldKg:0,stock:0,rev:0,unitUSD:0,exps:[],exp:0,profit:0,pct:0};
const SC = s => C.sale.get(s.id) || {tot:0,totUSD:0,got:0,due:0,pays:[],exps:[],exp:0};
const expUSD = x => usd(x.amount,x.cur,x.kur);

/* ---------- çizim ---------- */
function renderChrome(){
  const tabs = VIEWS.map(v=>`<button type="button" data-view="${v.k}" ${S.view===v.k?'aria-current="page"':""}>${v.t}</button>`).join("");
  document.getElementById("tabs").innerHTML = tabs;
  document.getElementById("btabs").innerHTML = VIEWS.map(v=>`<button type="button" data-view="${v.k}" ${S.view===v.k?'aria-current="page"':""}>${svg(v.ic,22)}${v.t}</button>`).join("");
  document.getElementById("firmsel").innerHTML = [["all","Tümü"],["a",firmName("a")],["b",firmName("b")]].map(([k,t])=>
    `<button type="button" data-firm="${k}" aria-pressed="${S.firm===k}">${k!=="all"?`<span class="dot" style="background:${firmColor(k)}"></span>`:""}${esc(t)}</button>`).join("");

}

function render(){

  h += ({ozet:vOzet,partiler:vPartiler,satislar:vSatislar,cari:vCari,arsiv:vArsiv}[S.view])();
  m.innerHTML = h;
  fillNames(m);
  const top = S.stack[S.stack.length-1];
  if(top && top.type!=="form") renderSheet();
}

/* --- Özet --- */
function vOzet(){
  const lots=S.lots.filter(inFirm), sales=S.sales.filter(inFirm);
  const yol=lots.filter(l=>l.status==="yuklendi"||l.status==="yolda");
  const dep=lots.filter(l=>l.status==="depoda");
  const pre=lots.filter(l=>STI[l.status]<=STI.yolda);
  const yolKg=yol.reduce((a,l)=>a+LC(l).kg,0), yolCnt=yol.reduce((a,l)=>a+(+l.cnt||0),0), yolVal=yol.reduce((a,l)=>a+LC(l).costUSD,0);
  const depKg=dep.reduce((a,l)=>a+Math.max(0,LC(l).stock),0), depVal=dep.reduce((a,l)=>a+Math.max(0,LC(l).stock)*LC(l).unitUSD,0);
  const prePaid=pre.reduce((a,l)=>a+LC(l).paid,0);
  const supDue=lots.reduce((a,l)=>a+Math.max(0,LC(l).due),0);
  const cusDue=sales.reduce((a,s)=>a+Math.max(0,SC(s).due),0);
  const yr=today().slice(0,4);
  const gross=sales.filter(s=>(s.date||"").startsWith(yr)).reduce((a,s)=>{const l=lotById(s.lotId); return a+SC(s).totUSD-(+s.kg||0)*(l?LC(l).unitUSD:0);},0);
  const yExp=S.exps.filter(inFirm).filter(x=>(x.date||"").startsWith(yr)).reduce((a,x)=>a+expUSD(x),0);
  const profit=gross-yExp;
  let h=`<div class="vh"><h2>Özet</h2><span class="muted">${fd(today())}${S.firm!=="all"?" · "+esc(firmName(S.firm)):""}</span></div>`;
  h+=`<div class="kpis">
    <div class="kpi"><div class="l">Yolda</div><div class="v">${kgf(yolKg)}</div><div class="s">${yol.length} parti${yolCnt?` · ${yolCnt} konteyner`:""} · ${usdf(yolVal)}</div></div>
    <div class="kpi"><div class="l">Serbest bölge stoku</div><div class="v">${kgf(depKg)}</div><div class="s">${dep.length} parti · maliyeti ${usdf(depVal)}</div></div>
    <div class="kpi"><div class="l">Gelmemiş mala ödenen</div><div class="v">${usdf(prePaid)}</div><div class="s">${pre.filter(l=>LC(l).paid>0).length} partide ön ödeme</div></div>
    <div class="kpi ${supDue>0?"warn":""}"><div class="l">Tedarikçiye borç</div><div class="v">${usdf(supDue)}</div><div class="s">ödenmemiş alış bakiyesi</div></div>
    <div class="kpi ${cusDue>0?"warn":""}"><div class="l">Müşteri alacağı</div><div class="v">${usdf(cusDue)}</div><div class="s">tahsil edilmemiş satış</div></div>
    <div class="kpi"><div class="l">${yr} kâr</div><div class="v">${usdf(profit)}</div><div class="s">${yExp?`${usdf(yExp)} masraf düşüldü`:"satılan mal üzerinden"}</div></div>
  </div>`;
  // dikkat
  const al=[];
  for(const l of lots){
    const c=LC(l);
    if((l.status==="yuklendi"||l.status==="yolda") && l.eta){ const d=days(l.eta);
      if(d<0) al.push({o:0,ic:"b",m:`${l.code} tahmini varış ${-d} gün geçti`,s:`${l.product} · ${fd(l.eta)}`,id:l.id});
      else if(d<=7) al.push({o:1,ic:"i",m:`${l.code} ${d===0?"bugün":d+" gün içinde"} Mersin'de`,s:`${l.product} · ${kgf(c.kg)}`,id:l.id}); }
    if(l.status==="depoda" && c.due>1) al.push({o:2,ic:"w",m:`${l.code} tedarikçiye ${usdf(c.due)} bakiye var`,s:`${l.supplier||"Tedarikçi"} · mal geldi`,id:l.id});
    if(l.status==="depoda" && c.kg>0 && c.stock<=0) al.push({o:3,ic:"i",m:`${l.code} stoğu bitti`,s:"Partiyi kapatabilirsin",id:l.id});
  }
  for(const s of sales){ const c=SC(s); if(c.due>1 && s.date && days(s.date)<=-30) al.push({o:2,ic:"w",m:`${s.customer||"Müşteri"} ${usdf(c.due)} ödemedi`,s:`Satış ${fd(s.date)} · ${-days(s.date)} gün`,sid:s.id}); }
  al.sort((a,b)=>a.o-b.o);
  const alH = al.length ? al.slice(0,8).map(a=>`<button type="button" class="row" ${a.id?`data-lot="${a.id}"`:`data-sale="${a.sid}"`}><span class="alert-ic ${a.ic}">${a.ic==="b"?"!":a.ic==="w"?"$":"›"}</span><span class="main"><div class="t">${esc(a.m)}</div><div class="sub">${esc(a.s)}</div></span></button>`).join("") : `<div class="empty">Şu an dikkat isteyen bir şey yok.</div>`;
  const yolS=[...yol].sort((a,b)=>(a.eta||"9").localeCompare(b.eta||"9"));
  const yolH = yolS.length ? yolS.map(l=>{const d=l.eta?days(l.eta):null; return `<button type="button" class="row" data-lot="${l.id}"><span class="main"><div class="t">${esc(l.product)} <span class="mono muted">${esc(l.code)}</span></div><div class="sub">${kgf(LC(l).kg)} · ${esc(l.origin||"")}${l.vessel?" · "+esc(l.vessel):""}</div></span><span class="end"><div class="a">${l.eta?fds(l.eta):"ETA yok"}</div><div class="b">${d===null?stPill(l.status):d<0?`${-d} gün gecikti`:d===0?"bugün":`${d} gün kaldı`}</div></span></button>`;}).join("") : `<div class="empty">Yolda parti yok.</div>`;
  h+=`<div class="grid2"><section><div class="sec-h"><h3>Dikkat</h3></div><div class="panel rows">${alH}</div></section>
     <section><div class="sec-h"><h3>Yoldaki partiler</h3><span class="muted r">varış sırasına göre</span></div><div class="panel rows">${yolH}</div></section></div>`;
  // stok
  const byP={};
  for(const l of dep){ const c=LC(l); if(c.stock<=0) continue; const p=byP[l.product]||(byP[l.product]={kg:0,val:0,lots:[]}); p.kg+=c.stock; p.val+=c.stock*c.unitUSD; p.lots.push(l.code); }
  const ps=Object.entries(byP).sort((a,b)=>b[1].kg-a[1].kg);
  h+=`<section><div class="sec-h"><h3>Serbest bölgedeki stok</h3><span class="muted r">ürün bazında</span></div><div class="panel">${ps.length?`<div class="tablewrap"><table><thead><tr><th>Ürün</th><th class="r">Miktar</th><th class="r">Maliyet</th><th>Partiler</th></tr></thead><tbody>${ps.map(([p,v])=>`<tr><td>${esc(p)}</td><td class="r">${nf0.format(v.kg)} kg</td><td class="r">${usdf(v.val)}</td><td class="mono muted">${esc(v.lots.join(", "))}</td></tr>`).join("")}</tbody><tfoot><tr><td>Toplam</td><td class="r">${nf0.format(depKg)} kg</td><td class="r">${usdf(depVal)}</td><td></td></tr></tfoot></table></div>`:`<div class="empty">Serbest bölgede stok yok. Bir parti "Mersin SB'de" aşamasına geçince burada görünür.</div>`}</div></section>`;
  // son hareketler
  const ev=archiveEntries().slice(0,6);
  h+=`<section><div class="sec-h"><h3>Son kayıtlar</h3><button class="btn sm r" type="button" data-view="arsiv">Tümünü gör</button></div><div class="panel rows">${ev.length?ev.map(entryRow).join(""):`<div class="empty">Henüz kayıt yok. Sağ üstteki <b>Ekle</b> ile ilk partini gir.</div>`}</div></section>`;
  return h;
}

/* --- Partiler --- */
function lotCard(l){
  const c=LC(l); const d=l.eta && (l.status==="yolda"||l.status==="yuklendi") ? days(l.eta) : null;
  let line2 = `${kgf(c.kg)}${l.origin?" · "+esc(l.origin):""}${l.supplier?" · "+esc(l.supplier):""}`;
  let line3 = "";
  if(d!==null) line3 = `Varış ${fds(l.eta)} · ${d<0?`<span style="color:var(--bad)">${-d} gün gecikti</span>`:d===0?"bugün":d+" gün"}`;
  else if(l.status==="depoda"||l.status==="kapandi") line3 = `Kalan stok <b>${kgf(Math.max(0,c.stock))}</b>${c.soldKg?` · satılan ${kgf(c.soldKg)}`:""}`;
  else if(l.orderDate) line3 = `Sipariş ${fds(l.orderDate)}`;
  return `<button type="button" class="card" data-lot="${l.id}">
    <div class="top1"><span class="mono muted">${esc(l.code||"—")}</span>${firmTag(l.firmId)}</div>
    <div class="prod">${esc(l.product||"Ürün yok")}</div>
    <div class="meta">${line2}${line3?"<br>"+line3:""}</div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(c.pct*100)}%"></i></div>
    <div class="barl"><span>Ödenen %${Math.round(c.pct*100)}</span><span>${c.due>1?"Kalan "+usdf(c.due):"Ödendi"}</span></div>
  </button>`;
}
function lotMatches(l,q){ if(!q) return true; return key([l.code,l.product,l.origin,l.supplier,l.cntNos,l.bl,l.vessel,l.note].join(" ")).includes(key(q)); }
function vPartiler(){
  const lots=S.lots.filter(inFirm).filter(l=>lotMatches(l,S.pq));
  const cnt=k=>lots.filter(l=>l.status===k).length;
  const stages = S.stage==="all" ? ST : ST.filter(s=>s.k===S.stage);
  let h=`<div class="vh"><h2>Partiler</h2><input class="search" id="pq" type="search" placeholder="Ara: ürün, kod, konteyner no…" value="${esc(S.pq)}">${canWrite&&db?`<button class="btn pri" type="button" data-act="new-lot">+ Yeni parti</button>`:""}</div>`;
  h+=`<div class="chips" role="group" aria-label="Aşama"><button type="button" class="chip" data-stage="all" aria-pressed="${S.stage==="all"}">Hepsi <span class="c">${lots.length}</span></button>${ST.map(s=>`<button type="button" class="chip" data-stage="${s.k}" aria-pressed="${S.stage===s.k}"><span class="dot" style="background:var(--st-${s.k})"></span>${s.s} <span class="c">${cnt(s.k)}</span></button>`).join("")}</div>`;
  if(!S.lots.length) return h+`<div class="panel"><div class="empty">Henüz parti yok. Bir alım yaptığında <b>+ Yeni parti</b> ile gir; sonra kartın aşamasını değiştirerek takip edersin: sipariş → ön ödeme → yüklendi → yolda → Mersin SB.</div></div>`;
  h+=`<div class="board" style="--cols:${stages.length}">${stages.map(s=>{
    let ls=lots.filter(l=>l.status===s.k).sort((a,b)=>(b.orderDate||b.createdAt||"").localeCompare(a.orderDate||a.createdAt||""));
    if(s.k==="kapandi" && S.stage==="all" && ls.length>6){ const n=ls.length-6; ls=ls.slice(0,6); return `<div class="col"><div class="col-h"><span class="dot" style="background:var(--st-${s.k})"></span>${s.t}<span class="c">${cnt(s.k)}</span></div>${ls.map(lotCard).join("")}<button class="btn sm" type="button" data-stage="kapandi">+${n} kapanmış parti</button></div>`; }
    return `<div class="col"><div class="col-h"><span class="dot" style="background:var(--st-${s.k})"></span>${s.t}<span class="c">${ls.length}</span></div>${ls.length?ls.map(lotCard).join(""):`<div class="none">Bu aşamada parti yok</div>`}</div>`;
  }).join("")}</div>`;
  return h;
}

/* --- Satışlar --- */
function vSatislar(){
  const all=S.sales.filter(inFirm);
  const sales=all.filter(s=>S.market==="all"||s.market===S.market).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const cnt=k=>all.filter(s=>s.market===k).length;
  let h=`<div class="vh"><h2>Satışlar</h2>${canWrite&&db?`<button class="btn pri" type="button" data-act="new-sale">+ Yeni satış</button>`:""}</div>`;

/* --- Cari --- */
function cariData(){
  const sup={}, cus={};
  const g=(o,n)=>{ const k=key(n)||"—"; return o[k]||(o[k]={name:(n||"—").trim(),a:0,p:0,items:[],last:""}); };
  for(const l of S.lots.filter(inFirm)){ const r=g(sup,l.supplier); r.a+=LC(l).costUSD; r.items.push(l); }
  for(const s of S.sales.filter(inFirm)){ const r=g(cus,s.customer); r.a+=SC(s).totUSD; r.items.push(s); }
  for(const p of S.pays.filter(inFirm)){ const r=g(p.dir==="out"?sup:cus,p.party); r.p+=usd(p.amount,p.cur,p.kur); if((p.date||"")>r.last) r.last=p.date; }
  return {sup:Object.values(sup).sort((a,b)=>(b.a-b.p)-(a.a-a.p)), cus:Object.values(cus).sort((a,b)=>(b.a-b.p)-(a.a-a.p))};
}

function expRel(x){ const s=saleById(x.saleId), l=lotById(x.lotId); return s?`${fds(s.date)} · ${s.customer||""} satışı`:l?`${l.code} · ${l.product}`:"Genel"; }
function vMasraf(){
  const es=S.exps.filter(inFirm).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(!es.length) return `<div class="panel"><div class="empty">Henüz masraf yok. Irak gümrüğü, TIR navlunu, gümrükçü ücreti gibi masrafları bir satışa ya da partiye bağlayarak gir; o işin kârından otomatik düşer.</div></div>`;
  const yr=today().slice(0,4); const byC={};
  for(const x of es){ if(!(x.date||"").startsWith(yr)) continue; byC[x.cat||"Diğer"]=(byC[x.cat||"Diğer"]||0)+expUSD(x); }

/* --- Arşiv --- */
function archiveEntries(){
  const out=[];
  for(const l of S.lots.filter(inFirm)) out.push({d:l.orderDate||(l.createdAt||"").slice(0,10),type:"p",ti:`${l.product||"Parti"} alımı`,sub:`${l.code||""} · ${l.supplier||""} · ${kgf(LC(l).kg)}`,amt:usdf(LC(l).costUSD),st:l.status,attr:`data-lot="${l.id}"`,txt:[l.code,l.product,l.supplier,l.origin,l.cntNos,l.bl,l.vessel,l.note].join(" ")});
  for(const s of S.sales.filter(inFirm)){ const l=lotById(s.lotId); out.push({d:s.date,type:"s",ti:`${s.customer||"Müşteri"} · ${MK[s.market]||""}`,sub:`${l?.product||""} ${l?.code||""} · ${nf0.format(+s.kg||0)} kg`,amt:moneyf(SC(s).tot,s.cur),attr:`data-sale="${s.id}"`,txt:[s.customer,l?.product,l?.code,s.docNo,s.plate,s.note,MK[s.market]].join(" ")}); }
  for(const p of S.pays.filter(inFirm)){ const rel=p.dir==="out"?lotById(p.lotId):null; out.push({d:p.date,type:p.dir==="out"?"o":"t",ti:`${p.dir==="out"?"Ödeme":"Tahsilat"} · ${p.party||""}`,sub:`${p.kind||""}${rel?" · "+rel.code:""}${p.method?" · "+p.method:""}`,amt:(p.dir==="out"?"−":"+")+moneyf(+p.amount||0,p.cur),attr:`data-pay="${p.id}"`,txt:[p.party,p.kind,p.method,p.note,rel?.code].join(" ")}); }
  for(const x of S.exps.filter(inFirm)) out.push({d:x.date,type:"m",ti:`Masraf · ${x.cat||""}`,sub:`${x.party?x.party+" · ":""}${expRel(x)}`,amt:"−"+moneyf(+x.amount||0,x.cur),attr:`data-exp="${x.id}"`,txt:[x.cat,x.party,x.note,expRel(x)].join(" ")});
  return out.sort((a,b)=>(b.d||"").localeCompare(a.d||""));
}
const TYL={p:"PRT",s:"SAT",o:"ÖDE",t:"TAH",m:"MSR"};
const entryRow = e => `<button type="button" class="row" ${e.attr}><span class="typeic ${e.type}">${TYL[e.type]}</span><span class="main"><div class="t">${esc(e.ti)}</div><div class="sub">${esc(e.sub)}</div></span><span class="end"><div class="a">${e.amt}</div><div class="b">${fd(e.d)}</div></span></button>`;

async function fillNames(root){

  try{ const ps=await user.profiles([...new Set(els.map(e=>e.dataset.uid))]); for(const e of els) e.textContent = ps[e.dataset.uid]?.name || "Bir kullanıcı"; }catch(e){}

/* ---------- sheet yığını ---------- */
function openSheet(d){ S.stack.push(d); renderSheet(); }
function closeSheet(){ S.stack.pop(); renderSheet(); }
function closeAll(){ S.stack=[]; renderSheet(); }
function renderSheet(){
  const root=document.getElementById("sheetroot");
  const top=S.stack[S.stack.length-1];
  if(!top){ root.innerHTML=""; document.body.style.overflow=""; return; }
  document.body.style.overflow="hidden";
  let r;
  if(top.type==="lot") r=sLot(top.id);
  else if(top.type==="sale") r=sSale(top.id);
  else if(top.type==="pay") r=sPay(top.id);
  else if(top.type==="exp") r=sExp(top.id);
  else if(top.type==="party") r=sParty(top.name,top.dir);
  else if(top.type==="choose") r=sChoose();
  else if(top.type==="settings") r=sSettings();
  else if(top.type==="form") r=top.r;
  if(!r){ S.stack.pop(); return renderSheet(); }
  const prevScroll = root.querySelector(".sh-body")?.scrollTop||0;
  const sameSheet = root.dataset.k === (top.type+(top.id||top.name||""));
  root.dataset.k = top.type+(top.id||top.name||"");
  root.innerHTML=`<div class="scrim" data-act="close-all"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="sh-head">${S.stack.length>1?`<button class="iconbtn" type="button" data-act="back" aria-label="Geri">${svg('<path d="M15 18l-6-6 6-6"/>',18)}</button>`:""}<h3 id="sh-t">${r.title}</h3><button class="iconbtn" type="button" data-act="close-all" aria-label="Kapat">${svg('<path d="M18 6L6 18M6 6l12 12"/>',18)}</button></div>
    <div class="sh-body">${r.body}</div>${r.foot?`<div class="sh-foot">${r.foot}</div>`:""}</div>`;
  if(sameSheet) root.querySelector(".sh-body").scrollTop=prevScroll;
  if(top.type==="form"){ bindForm(top); if(!sameSheet) setTimeout(()=>root.querySelector(".sh-body input:not([type=hidden]),.sh-body select")?.focus({preventScroll:true}),30); }
  fillNames(root);
}

function openForm(o){ const d={type:"form",o,v:{...(o.values||{})}}; d.r={title:o.title,body:`<form class="form" id="frm" novalidate>${o.fields.map(f=>fieldHTML(f,d.v)).join("")}</form>`,foot:`<div class="ferr" id="ferr" hidden></div><button class="btn" type="button" data-act="back">Vazgeç</button><span class="sp"></span><button class="btn pri" type="button" data-act="form-save">Kaydet</button>`}; openSheet(d); }
function fieldHTML(f,v){
  if(f.section) return `<h4 class="fsec">${f.section}</h4>`;
  const id="f_"+f.k; let val=v[f.k]; if(val===undefined||val===null) val=f.def??"";
  const cls=`fld ${f.half?"half":""} ${f.third?"third":""}`;
  const lbl=f.label?`<span class="lbl">${f.label}${f.req?" *":""}</span>`:"";
  const hint=f.hint?`<span class="hint">${f.hint}</span>`:"";
  if(f.type==="seg") return `<div class="${cls}" data-f="${f.k}">${lbl}<div class="seg" role="radiogroup" aria-label="${esc(f.label||f.k)}" data-k="${f.k}" data-t="seg">${f.options.map(([o,t])=>`<button type="button" role="radio" aria-checked="${String(val)===String(o)}" data-v="${esc(o)}">${esc(t)}</button>`).join("")}</div>${hint}</div>`;
  let inp;
  if(f.type==="select") inp=`<select id="${id}" data-k="${f.k}">${(typeof f.options==="function"?f.options(v):f.options).map(([o,t])=>`<option value="${esc(o)}" ${String(val)===String(o)?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
  else if(f.type==="textarea") inp=`<textarea id="${id}" data-k="${f.k}" rows="3">${esc(val)}</textarea>`;
  else if(f.type==="num") inp=`<input id="${id}" data-k="${f.k}" data-t="num" type="text" inputmode="decimal" autocomplete="off" value="${val===""?"":esc(String(val).replace(".",","))}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}>`;
  else if(f.type==="date") inp=`<input id="${id}" data-k="${f.k}" type="date" value="${esc(val)}">`;
  else { const list=typeof f.list==="function"?f.list():f.list; inp=`<input id="${id}" data-k="${f.k}" type="text" autocomplete="off" value="${esc(val)}" ${list?`list="dl_${f.k}"`:""} ${f.ph?`placeholder="${esc(f.ph)}"`:""}>${list?`<datalist id="dl_${f.k}">${list.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:""}`; }
  return `<label class="${cls}" data-f="${f.k}">${lbl}${inp}${hint}</label>`;
}
function readForm(){
  const v={}; const f=document.getElementById("frm"); if(!f) return v;
  f.querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k;
    if(el.dataset.t==="seg") v[k]=el.querySelector('[aria-checked="true"]')?.dataset.v ?? "";
    else if(el.dataset.t==="num") v[k]=parseNum(el.value);
    else v[k]=el.value.trim();
  });
  return v;
}
function bindForm(d){
  const f=document.getElementById("frm"); if(!f) return;
  const upd=()=>{ const v=readForm(); for(const fl of d.o.fields){ if(!fl.showIf) continue; const el=f.querySelector(`[data-f="${fl.k}"]`); if(el) el.hidden=!fl.showIf(v); } d.o.onChange?.(v,f); };
  f.addEventListener("click",e=>{ const b=e.target.closest(".seg button"); if(!b) return; b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",String(x===b))); upd(); });
  f.addEventListener("input",upd); f.addEventListener("change",upd);
  f.addEventListener("submit",e=>e.preventDefault());
  upd();
}
async function formSave(){
  const top=S.stack[S.stack.length-1]; if(top?.type!=="form") return;
  const v=readForm(); const err=document.getElementById("ferr");
  const fail=m=>{ err.textContent=m; err.hidden=false; };
  for(const fl of top.o.fields){ if(fl.section) continue; if(fl.showIf&&!fl.showIf(v)) continue;
    const x=v[fl.k]; if(fl.req && (x===""||x===null||x===undefined)) return fail(`"${fl.label}" boş olamaz.`);
    if(fl.type==="num" && Number.isNaN(x)) return fail(`"${fl.label}" sayı olmalı. Örnek: 12.500 ya da 7,45`); }
  const btn=document.querySelector('[data-act="form-save"]'); btn.disabled=true; btn.textContent="Kaydediliyor…";
  try{ const r=await top.o.onSave(v); if(typeof r==="string"){ btn.disabled=false; btn.textContent="Kaydet"; return fail(r); } S.stack.pop(); renderSheet(); toast("Kaydedildi"); }
  catch(e){ btn.disabled=false; btn.textContent="Kaydet"; fail(dbErr(e)); }
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-view],[data-firm],[data-stage],[data-market],[data-cari],[data-atype],[data-lot],[data-sale],[data-pay],[data-exp],[data-party],[data-setst],[data-act]");
  if(!t) return;
  const d=t.dataset;
  if(d.act){
    const a=d.act;
    if(a==="close-all") return closeAll();
    if(a==="back") return closeSheet();
    if(a==="form-save") return formSave();
    if(a==="del") return doDelete(t);
    if(a==="clear-ex") return clearExamples(t);
    if(a==="export") return exportXlsx(t);
    if(a==="save-firms"){ (async()=>{ try{ for(const k of ["a","b"]){ const n=document.getElementById("fn_"+k).value.trim(); if(n && n!==firmName(k)) await db.doc("firms/"+k).set({name:n}); } toast("Firma adları kaydedildi"); }catch(err){ toast(dbErr(err)); } })(); return; }
    if(!db) return;
    if(S.stack[S.stack.length-1]?.type==="choose") S.stack.pop();
    if(a==="new-lot") return lotForm(null);
    if(a==="new-sale") return saleForm(null);
    if(a==="new-pay") return payForm(null);
    if(a==="new-pay-out") return payForm(null,{dir:"out"});
    if(a==="new-pay-in") return payForm(null,{dir:"in",kind:"Tahsilat"});
    if(a==="edit-lot") return lotForm(lotById(d.id));
    if(a==="edit-sale") return saleForm(saleById(d.id));
    if(a==="edit-pay") return payForm(S.pays.find(p=>p.id===d.id));
    if(a==="pay-lot"){ const l=lotById(d.id); return payForm(null,{dir:"out",lotId:d.id,kind:LC(l).paid>0?"Bakiye":"Ön ödeme"}); }
    if(a==="sale-lot") return saleForm(null,d.id);
    if(a==="pay-sale") return payForm(null,{dir:"in",saleId:d.id,kind:"Tahsilat"});
    if(a==="new-exp") return expForm(null);
    if(a==="edit-exp") return expForm(S.exps.find(x=>x.id===d.id));
    if(a==="exp-lot") return expForm(null,{link:"lot",lotId:d.id,cat:"Gümrük müşaviri"});
    if(a==="exp-sale"){ const s=saleById(d.id); return expForm(null,{link:"sale",saleId:d.id,cat:s?.market==="irak"?"Irak gümrüğü":s?.market==="diger"?"İhracat masrafı":"TIR navlunu (Mersin yükleme)"}); }
    if(a==="pay-party") return payForm(null,{dir:d.dir,party:d.name,kind:d.dir==="in"?"Tahsilat":"Ödeme"});
    return;
  }
  if(d.view){ S.view=d.view; save("pd.view",S.view); render(); window.scrollTo(0,0); return; }
  if(d.firm){ S.firm=d.firm; save("pd.firm",S.firm); render(); return; }
  if(d.stage){ S.stage=S.stage===d.stage&&d.stage!=="all"?"all":d.stage; render(); return; }
  if(d.market){ S.market=d.market; render(); return; }
  if(d.cari){ S.cari=d.cari; render(); return; }
  if(d.atype){ S.atype=d.atype; render(); return; }
  if(d.setst){ return setStatus(S.stack[S.stack.length-1]?.id, d.setst); }
  if(d.lot) return openSheet({type:"lot",id:d.lot});
  if(d.sale) return openSheet({type:"sale",id:d.sale});
  if(d.pay) return openSheet({type:"pay",id:d.pay});
  if(d.exp) return openSheet({type:"exp",id:d.exp});
  if(d.party) return openSheet({type:"party",name:d.party,dir:d.pdir});
});

function sub(col,fn){

    err=>{ S.conn = err?.code==="revoked" ? "Bu sayfaya erişimin değişti." : "Kayıtlarla bağlantı koptu. Sayfayı yenile."; render(); });
}
async function init(){
  render();
  if(!window.claude?.use){ S.conn="Bu sayfa kayıt tutmak için claude.ai içinde açılmalı."; render(); return; }
  const [d,u,w]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
  db=d; user=u; dl=w;
  if(!db){ S.conn="Kayıtlara ulaşılamadı. claude.ai hesabınla oturum açıp sayfayı yeniden aç."; render(); return; }
  if(user){ try{ me=await user.id(); const c=await user.can("data.write"); if(c===false) canWrite=false; }catch(e){} }
  const map=snap=>snap.docs.map(x=>({id:x.id,...x.data()}));
