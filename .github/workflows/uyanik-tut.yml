# Supabase ücretsiz projesi 7 gün kullanılmazsa durur; bu iş her gün küçük bir istek atar.
name: uyanik-tut
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase'e istek at
        run: |
          URL=$(grep -o 'url: "[^"]*"' config.js | cut -d'"' -f2)
          KEY=$(grep -o 'key: "[^"]*"' config.js | cut -d'"' -f2)
          if [ -z "$URL" ]; then echo "config.js boş, atlandı"; exit 0; fi
          curl -fsS "$URL/rest/v1/members?select=email&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null -w "HTTP %{http_code}\n"
      - name: Ayda bir depoyu canlı tut (GitHub 60 gün işlemsiz depoda zamanlanmış işleri durdurur)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date -u +%Y-%m-%d > .uyanik
            git config user.name "uyanik-tut"; git config user.email "actions@users.noreply.github.com"
            git add .uyanik && git commit -m "uyanık tut" && git push || true
          fi
